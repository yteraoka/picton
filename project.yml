name: Picton
options:
  bundleIdPrefix: com.yteraoka
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"
  generateEmptyDirectories: true

targets:
  Picton:
    type: application
    platform: iOS
    sources:
      - Picton
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.teraoka.Picton
        DEVELOPMENT_TEAM: H6KG946X5L
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "カードに使う画像を選ぶために写真ライブラリにアクセスします"
        INFOPLIST_KEY_NSCameraUsageDescription: "カードに使う画像を撮影するためにカメラを使用します"
        # 暗号化は一切使用していないため NO。設定しておくと
        # App Store Connect へのアップロードのたびに輸出コンプライアンスを聞かれなくなる
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        # Swift 6 言語モード（並行処理の安全性をコンパイラが検査する）(#62)
        SWIFT_VERSION: "6.0"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: 1
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
    scheme:
      testTargets:
        - PictonTests
        - PictonUITests

  PictonTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - PictonTests
    dependencies:
      - target: Picton
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: me.teraoka.PictonTests
        DEVELOPMENT_TEAM: H6KG946X5L
        SWIFT_VERSION: "6.0"

  PictonUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - PictonUITests
    dependencies:
      - target: Picton
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: me.teraoka.PictonUITests
        DEVELOPMENT_TEAM: H6KG946X5L
        SWIFT_VERSION: "5.9"
